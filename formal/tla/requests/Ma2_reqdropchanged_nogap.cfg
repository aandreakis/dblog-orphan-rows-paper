\* MUTATION (a), without the visibility gap (every transaction visible at commit), so the only changed keys are the window's. Expected: RequestSafe violated (a key inserted inside the batch's window certified absent).
\* Bounds: N=3 keys, Vals={v1, v2}, MaxWrites=2, ChunkSize=1, TailLimit=1, MaxCrashes=0, MaxReqs=1, BatchSize=1.
SPECIFICATION RSpec
CONSTANTS
  N = 3
  Vals = {v1, v2}
  NULL = NULL
  MaxWrites = 2
  ChunkSize = 1
  TailLimit = 1
  MaxCrashes = 0
  VisGap = FALSE
  PrePassSettled = TRUE
  VisRule = "changed"
  PersistPend = TRUE
  Dense = FALSE
  Record = FALSE
  ProgressAtFirst = FALSE
  FullPageOpen = FALSE
  DropChanged = FALSE
  CommitBeforeAck = FALSE
  ResetTailOnRestart = FALSE
  ReRecordMax = FALSE
  MaxReqs = 1
  BatchSize = 1
  Interleave = FALSE
  HandOff = "off"
  EndReads = FALSE
  ReqDropChanged = TRUE
  HiAtTail = FALSE
  DropReqsOnRestart = FALSE
  DriftDirectDelete = FALSE
  SharedPend = FALSE
  ReqDoneAtFirst = FALSE
SYMMETRY ValPerms
INVARIANTS
  RequestSafe
CHECK_DEADLOCK FALSE
