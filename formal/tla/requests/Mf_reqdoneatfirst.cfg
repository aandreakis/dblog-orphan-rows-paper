\* MUTATION (f): a batch's completion is committed with its first absence event (R9 broken). Expected: ReqCovers violated (a crash committed after the first entry drops the rest of the batch: convergence, not safety).
\* Bounds: N=2 keys, Vals={v1, v2}, MaxWrites=2, ChunkSize=1, TailLimit=1, MaxCrashes=1, MaxReqs=1, BatchSize=2.
SPECIFICATION RSpec
CONSTANTS
  N = 2
  Vals = {v1, v2}
  NULL = NULL
  MaxWrites = 2
  ChunkSize = 1
  TailLimit = 1
  MaxCrashes = 1
  VisGap = TRUE
  PrePassSettled = TRUE
  VisRule = "changed"
  PersistPend = TRUE
  Dense = FALSE
  Record = FALSE
  ProgressAtFirst = FALSE
  FullPageOpen = FALSE
  DropChanged = FALSE
  CommitBeforeAck = FALSE
  ResetTailOnRestart = FALSE
  ReRecordMax = FALSE
  MaxReqs = 1
  BatchSize = 2
  Interleave = FALSE
  HandOff = "off"
  EndReads = FALSE
  ReqDropChanged = FALSE
  HiAtTail = FALSE
  DropReqsOnRestart = FALSE
  DriftDirectDelete = FALSE
  SharedPend = FALSE
  ReqDoneAtFirst = TRUE
SYMMETRY ValPerms
INVARIANTS
  ReqCovers
CHECK_DEADLOCK FALSE
