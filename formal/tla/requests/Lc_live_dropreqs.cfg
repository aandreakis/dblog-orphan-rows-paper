\* MUTATION (c) under liveness: requested keys dropped at a restart. Expected: RequestEventuallyServed violated.
\* Bounds: N=2 keys, Vals={v1, v2}, MaxWrites=1, ChunkSize=1, TailLimit=1, MaxCrashes=1, MaxReqs=1, BatchSize=1.
SPECIFICATION LSpec
CONSTANTS
  N = 2
  Vals = {v1, v2}
  NULL = NULL
  MaxWrites = 1
  ChunkSize = 1
  TailLimit = 1
  MaxCrashes = 1
  VisGap = TRUE
  PrePassSettled = TRUE
  VisRule = "changed"
  PersistPend = TRUE
  Dense = FALSE
  Record = FALSE
  ProgressAtFirst = FALSE
  FullPageOpen = FALSE
  DropChanged = FALSE
  CommitBeforeAck = FALSE
  ResetTailOnRestart = FALSE
  ReRecordMax = FALSE
  MaxReqs = 1
  BatchSize = 1
  Interleave = FALSE
  HandOff = "off"
  EndReads = FALSE
  ReqDropChanged = FALSE
  HiAtTail = FALSE
  DropReqsOnRestart = TRUE
  DriftDirectDelete = FALSE
  SharedPend = FALSE
  ReqDoneAtFirst = FALSE
INVARIANTS
  RTypeOK
PROPERTIES
  RequestEventuallyServed
CHECK_DEADLOCK FALSE
