\* LIVENESS, the end-of-pass reads and the hand-off in either terminal phase, no drift request, under LSpec. Expected: both properties hold.
\* Bounds: N=2 keys, Vals={v1, v2}, MaxWrites=2, ChunkSize=1, TailLimit=1, MaxCrashes=0, MaxReqs=0, BatchSize=1.
SPECIFICATION LSpec
CONSTANTS
  N = 2
  Vals = {v1, v2}
  NULL = NULL
  MaxWrites = 2
  ChunkSize = 1
  TailLimit = 1
  MaxCrashes = 0
  VisGap = TRUE
  PrePassSettled = TRUE
  VisRule = "changed"
  PersistPend = TRUE
  Dense = FALSE
  Record = FALSE
  ProgressAtFirst = FALSE
  FullPageOpen = FALSE
  DropChanged = FALSE
  CommitBeforeAck = FALSE
  ResetTailOnRestart = FALSE
  ReRecordMax = FALSE
  MaxReqs = 0
  BatchSize = 1
  Interleave = FALSE
  HandOff = "end"
  EndReads = TRUE
  ReqDropChanged = FALSE
  HiAtTail = FALSE
  DropReqsOnRestart = FALSE
  DriftDirectDelete = FALSE
  SharedPend = FALSE
  ReqDoneAtFirst = FALSE
INVARIANTS
  RTypeOK
PROPERTIES
  RequestEventuallyServed
  EventuallyConverged
CHECK_DEADLOCK FALSE
