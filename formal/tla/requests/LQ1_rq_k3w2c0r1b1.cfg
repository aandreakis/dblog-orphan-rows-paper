\* GREEN, serialized requests (the paper's default), treat-as-changed visibility rule with the gap, transactions before the pass visible at its start, free candidate lists. Three keys, two writes, one drift request, batch 1 (long queue). Expected: no error.
\* Bounds: N=3 keys, Vals={v1, v2}, MaxWrites=2, ChunkSize=1, TailLimit=1, MaxCrashes=0, MaxReqs=1, BatchSize=1.
