  N = 3
  Vals = {v1, v2}
  NULL = NULL
  MaxWrites = 2
  ChunkSize = 1
  TailLimit = 1
  MaxCrashes = 0
  VisGap = TRUE
  PrePassSettled = TRUE
  VisRule = "changed"
  PersistPend = TRUE
