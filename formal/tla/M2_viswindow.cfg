  PersistPend = TRUE
  Dense = FALSE
  Record = FALSE
  ProgressAtFirst = FALSE
  FullPageOpen = FALSE
  DropChanged = FALSE
  CommitBeforeAck = FALSE
  ResetTailOnRestart = FALSE
  ReRecordMax = FALSE
SYMMETRY ValPerms
