\* MUTATION: the visibility rule limited to the window. Under this rule the visibility keys are a subset of the window keys, so this is M1's transition relation: its trace is M1's and is not independent evidence. Expected: CloseEntryTrue violated.
\* Bounds: N=3 keys, Vals={v1, v2}, MaxWrites=3, ChunkSize=1, TailLimit=1, MaxCrashes=0.
