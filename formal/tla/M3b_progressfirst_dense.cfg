\* MUTATION (Dense, the per-key rendering of the record's key set): chunk progress persisted with the first close entry, operational invariants only. Expected: RecordConverges or QuiescentSafe violated.
\* Bounds: N=3 keys, Vals={v1, v2}, MaxWrites=3, ChunkSize=1, TailLimit=1, MaxCrashes=1.
SPECIFICATION Spec
CONSTANTS
  N = 3
  Vals = {v1, v2}
  NULL = NULL
  MaxWrites = 3
  ChunkSize = 1
  TailLimit = 1
  MaxCrashes = 1
  VisGap = TRUE
  PrePassSettled = TRUE
  VisRule = "changed"
  PersistPend = TRUE
  Dense = TRUE
  Record = FALSE
  ProgressAtFirst = TRUE
  FullPageOpen = FALSE
  DropChanged = FALSE
  CommitBeforeAck = FALSE
  ResetTailOnRestart = FALSE
  ReRecordMax = FALSE
SYMMETRY ValPerms
INVARIANTS
  TypeOK
  CloseEntryTrue
  SinkValueExisted
  QuiescentSafe
  QuiescentConverges
  RecordConverges
CHECK_DEADLOCK FALSE
