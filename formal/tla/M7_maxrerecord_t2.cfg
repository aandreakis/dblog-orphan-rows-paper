\* MUTATION: the maximum key queried again at a restart, TailLimit 2. Expected: TilingOK violated (MaxPersisted, the bookkeeping check).
\* Bounds: N=3 keys, Vals={v1}, MaxWrites=3, ChunkSize=1, TailLimit=2, MaxCrashes=1.
SPECIFICATION Spec
CONSTANTS
  N = 3
  Vals = {v1}
  NULL = NULL
  MaxWrites = 3
  ChunkSize = 1
  TailLimit = 2
  MaxCrashes = 1
  VisGap = FALSE
  PrePassSettled = TRUE
  VisRule = "changed"
  PersistPend = TRUE
  Dense = FALSE
  Record = FALSE
  ProgressAtFirst = FALSE
  FullPageOpen = FALSE
  DropChanged = FALSE
  CommitBeforeAck = FALSE
  ResetTailOnRestart = FALSE
  ReRecordMax = TRUE
SYMMETRY ValPerms
INVARIANTS
  TypeOK
  CloseEntryTrue
  SinkValueExisted
  QuiescentSafe
  QuiescentConverges
  TilingOK
  LocaleAssumptions
  ScopeBridge
CHECK_DEADLOCK FALSE
