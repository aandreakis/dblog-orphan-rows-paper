\* MUTATION (Record mode): the offset context committed before the record item is acknowledged (CrashEarly), operational invariants. Expected: RecordConverges or QuiescentSafe violated.
\* Bounds: N=3 keys, Vals={v1, v2}, MaxWrites=3, ChunkSize=1, TailLimit=1, MaxCrashes=1.
SPECIFICATION Spec
CONSTANTS
  N = 3
  Vals = {v1, v2}
  NULL = NULL
  MaxWrites = 3
  ChunkSize = 1
  TailLimit = 1
  MaxCrashes = 1
  VisGap = TRUE
  PrePassSettled = TRUE
  VisRule = "changed"
  PersistPend = TRUE
  Dense = FALSE
  Record = TRUE
  ProgressAtFirst = FALSE
  FullPageOpen = FALSE
  DropChanged = FALSE
  CommitBeforeAck = TRUE
  ResetTailOnRestart = FALSE
  ReRecordMax = FALSE
SYMMETRY ValPerms
INVARIANTS
  TypeOK
  CloseEntryTrue
  SinkValueExisted
  QuiescentSafe
  QuiescentConverges
  RecordConverges
  DeliveredRecordAbsence
CHECK_DEADLOCK FALSE
