\* MUTATION: the tail count reset to 0 at a restart, TailLimit 2. Expected: TilingOK violated (a tail read beyond the limit).
\* Bounds: N=3 keys, Vals={v1}, MaxWrites=2, ChunkSize=1, TailLimit=2, MaxCrashes=1.
SPECIFICATION Spec
CONSTANTS
  N = 3
  Vals = {v1}
  NULL = NULL
  MaxWrites = 2
  ChunkSize = 1
  TailLimit = 2
  MaxCrashes = 1
  VisGap = TRUE
  PrePassSettled = TRUE
  VisRule = "changed"
  PersistPend = TRUE
  Dense = FALSE
  Record = FALSE
  ProgressAtFirst = FALSE
  FullPageOpen = FALSE
  DropChanged = FALSE
  CommitBeforeAck = FALSE
  ResetTailOnRestart = TRUE
  ReRecordMax = FALSE
SYMMETRY ValPerms
INVARIANTS
  TypeOK
  CloseEntryTrue
  SinkValueExisted
  QuiescentSafe
  QuiescentConverges
  TilingOK
  LocaleAssumptions
  ScopeBridge
CHECK_DEADLOCK FALSE
