\* GREEN, Record: the chunk info record itself, the whole close block one atomic item, treat-as-changed variant. Expected: no error, RecordConverges and DeliveredRecordAbsence across crashes. Chunk size 2 (also the Record counterpart of G5).
\* Bounds: N=3 keys, Vals={v1, v2}, MaxWrites=3, ChunkSize=2, TailLimit=1, MaxCrashes=1.
SPECIFICATION Spec
CONSTANTS
  N = 3
  Vals = {v1, v2}
  NULL = NULL
  MaxWrites = 3
  ChunkSize = 2
  TailLimit = 1
  MaxCrashes = 1
  VisGap = TRUE
  PrePassSettled = TRUE
  VisRule = "changed"
  PersistPend = TRUE
  Dense = FALSE
  Record = TRUE
  ProgressAtFirst = FALSE
  FullPageOpen = FALSE
  DropChanged = FALSE
  CommitBeforeAck = FALSE
  ResetTailOnRestart = FALSE
  ReRecordMax = FALSE
SYMMETRY ValPerms
INVARIANTS
  TypeOK
  CloseEntryTrue
  SinkValueExisted
  QuiescentSafe
  QuiescentConverges
  RecordConverges
  TilingOK
  LocaleAssumptions
  ScopeBridge
  DeliveredRecordAbsence
CHECK_DEADLOCK FALSE
