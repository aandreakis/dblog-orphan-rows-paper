\* REGRESSION (cap off, Cap = 0): the core configuration G7r_record_k3w3c0.cfg run on the extension's SpecH. Expected: the core's verdict and the core's state counts exactly.
\* GREEN, Record: the chunk info record itself, the whole close block one atomic item, treat-as-changed variant. Expected: no error, RecordConverges and DeliveredRecordAbsence across crashes.
\* Bounds: N=3 keys, Vals={v1, v2}, MaxWrites=3, ChunkSize=1, TailLimit=1, MaxCrashes=0.
SPECIFICATION SpecH
CONSTANTS
  N = 3
  Vals = {v1, v2}
  NULL = NULL
  MaxWrites = 3
  ChunkSize = 1
  TailLimit = 1
  MaxCrashes = 0
  VisGap = TRUE
  PrePassSettled = TRUE
  VisRule = "changed"
  PersistPend = TRUE
  Dense = FALSE
  Record = TRUE
  ProgressAtFirst = FALSE
  FullPageOpen = FALSE
  DropChanged = FALSE
  CommitBeforeAck = FALSE
  ResetTailOnRestart = FALSE
  ReRecordMax = FALSE
  Cap = 0
  HoldMode = "persist"
  PersistHolds = TRUE
  StaleRelease = FALSE
  RelNoWindow = FALSE
  SinkAppliesUnconfirmed = FALSE
SYMMETRY ValPerms
INVARIANTS
  TypeOK
  CloseEntryTrue
  SinkValueExisted
  QuiescentSafe
  QuiescentConverges
  RecordConverges
  TilingOK
  LocaleAssumptions
  ScopeBridge
  DeliveredRecordAbsence
CHECK_DEADLOCK FALSE
