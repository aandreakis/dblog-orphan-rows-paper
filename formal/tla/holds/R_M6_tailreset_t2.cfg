\* REGRESSION (cap off, Cap = 0): the core configuration M6_tailreset_t2.cfg run on the extension's SpecH. Expected: the core's verdict and the core's state counts exactly.
\* MUTATION: the tail count reset to 0 at a restart, TailLimit 2. Expected: TilingOK violated (a tail read beyond the limit).
\* Bounds: N=3 keys, Vals={v1}, MaxWrites=2, ChunkSize=1, TailLimit=2, MaxCrashes=1.
SPECIFICATION SpecH
CONSTANTS
  N = 3
  Vals = {v1}
  NULL = NULL
  MaxWrites = 2
  ChunkSize = 1
  TailLimit = 2
  MaxCrashes = 1
  VisGap = TRUE
  PrePassSettled = TRUE
  VisRule = "changed"
  PersistPend = TRUE
  Dense = FALSE
  Record = FALSE
  ProgressAtFirst = FALSE
  FullPageOpen = FALSE
  DropChanged = FALSE
  CommitBeforeAck = FALSE
  ResetTailOnRestart = TRUE
  ReRecordMax = FALSE
  Cap = 0
  HoldMode = "persist"
  PersistHolds = TRUE
  StaleRelease = FALSE
  RelNoWindow = FALSE
  SinkAppliesUnconfirmed = FALSE
SYMMETRY ValPerms
INVARIANTS
  TypeOK
  CloseEntryTrue
  SinkValueExisted
  QuiescentSafe
  QuiescentConverges
  TilingOK
  LocaleAssumptions
  ScopeBridge
CHECK_DEADLOCK FALSE
