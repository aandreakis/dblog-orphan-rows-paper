\* MUTATION (c), safety and the bridge only (Dense, persist, one crash). Expected: no error (a lost hold costs convergence, not safety).
\* Bounds: N=3 keys, Vals={v1, v2}, MaxWrites=2, ChunkSize=1, TailLimit=1, MaxCrashes=1, Cap=1, HoldMode=persist.
SPECIFICATION SpecH
CONSTANTS
  N = 3
  Vals = {v1, v2}
