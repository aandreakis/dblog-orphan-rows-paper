\* WITNESS two releases of one range in one incarnation: a refused record stays durable while its chunk is re-executed and refused again (Record, one crash). Expected: WitDuplicateHold violated.
\* Bounds: N=3 keys, Vals={v1, v2}, MaxWrites=2, ChunkSize=1, TailLimit=1, MaxCrashes=1, Cap=1, HoldMode=persist.
SPECIFICATION SpecH
CONSTANTS
  N = 3
  Vals = {v1, v2}
  NULL = NULL
  MaxWrites = 2
  ChunkSize = 1
  TailLimit = 1
  MaxCrashes = 1
  VisGap = TRUE
  PrePassSettled = TRUE
  VisRule = "changed"
  PersistPend = TRUE
  Dense = FALSE
  Record = TRUE
  ProgressAtFirst = FALSE
  FullPageOpen = FALSE
  DropChanged = FALSE
  CommitBeforeAck = FALSE
  ResetTailOnRestart = FALSE
  ReRecordMax = FALSE
  Cap = 1
  HoldMode = "persist"
  PersistHolds = TRUE
  StaleRelease = FALSE
  RelNoWindow = FALSE
  SinkAppliesUnconfirmed = FALSE
SYMMETRY ValPerms
INVARIANTS
  WitDuplicateHold
CHECK_DEADLOCK FALSE
