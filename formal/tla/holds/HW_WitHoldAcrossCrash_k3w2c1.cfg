\* WITNESS a hold released by a later incarnation than its chunk's (Dense, persist, one crash). Expected: WitHoldAcrossCrash violated.
\* Bounds: N=3 keys, Vals={v1, v2}, MaxWrites=2, ChunkSize=1, TailLimit=1, MaxCrashes=1, Cap=1, HoldMode=persist.
SPECIFICATION SpecH
CONSTANTS
  N = 3
  Vals = {v1, v2}
  NULL = NULL
  MaxWrites = 2
  ChunkSize = 1
  TailLimit = 1
  MaxCrashes = 1
  VisGap = TRUE
  PrePassSettled = TRUE
  VisRule = "changed"
  PersistPend = TRUE
  Dense = TRUE
  Record = FALSE
  ProgressAtFirst = FALSE
  FullPageOpen = FALSE
  DropChanged = FALSE
  CommitBeforeAck = FALSE
  ResetTailOnRestart = FALSE
  ReRecordMax = FALSE
  Cap = 1
  HoldMode = "persist"
  PersistHolds = TRUE
  StaleRelease = FALSE
  RelNoWindow = FALSE
  SinkAppliesUnconfirmed = FALSE
SYMMETRY ValPerms
INVARIANTS
  WitHoldAcrossCrash
CHECK_DEADLOCK FALSE
