\* REGRESSION (cap off, Cap = 0): the core configuration D1_dense_crash_recordabsence.cfg run on the extension's SpecH. Expected: the core's verdict and the core's state counts exactly.
\* PROBE (review D1): Dense with a crash, DeliveredRecordAbsence. Expected: VIOLATED (the per-key rendering is not the atomic record across a crash).
\* Bounds: N=2 keys, Vals={v1}, MaxWrites=1, ChunkSize=1, TailLimit=1, MaxCrashes=1.
SPECIFICATION SpecH
CONSTANTS
  N = 2
  Vals = {v1}
  NULL = NULL
  MaxWrites = 1
  ChunkSize = 1
  TailLimit = 1
  MaxCrashes = 1
  VisGap = FALSE
  PrePassSettled = TRUE
  VisRule = "wait"
  PersistPend = TRUE
  Dense = TRUE
  Record = FALSE
  ProgressAtFirst = FALSE
  FullPageOpen = FALSE
  DropChanged = FALSE
  CommitBeforeAck = FALSE
  ResetTailOnRestart = FALSE
  ReRecordMax = FALSE
  Cap = 0
  HoldMode = "persist"
  PersistHolds = TRUE
  StaleRelease = FALSE
  RelNoWindow = FALSE
  SinkAppliesUnconfirmed = FALSE
SYMMETRY ValPerms
INVARIANTS
  DeliveredRecordAbsence
CHECK_DEADLOCK FALSE
