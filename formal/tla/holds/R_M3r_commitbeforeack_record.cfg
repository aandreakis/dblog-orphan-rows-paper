\* REGRESSION (cap off, Cap = 0): the core configuration M3r_commitbeforeack_record.cfg run on the extension's SpecH. Expected: the core's verdict and the core's state counts exactly.
\* MUTATION (Record mode): the offset context committed before the record item is acknowledged (CrashEarly), operational invariants. Expected: RecordConverges or QuiescentSafe violated.
\* Bounds: N=3 keys, Vals={v1, v2}, MaxWrites=3, ChunkSize=1, TailLimit=1, MaxCrashes=1.
SPECIFICATION SpecH
CONSTANTS
  N = 3
  Vals = {v1, v2}
  NULL = NULL
  MaxWrites = 3
  ChunkSize = 1
  TailLimit = 1
  MaxCrashes = 1
  VisGap = TRUE
  PrePassSettled = TRUE
  VisRule = "changed"
  PersistPend = TRUE
  Dense = FALSE
  Record = TRUE
  ProgressAtFirst = FALSE
  FullPageOpen = FALSE
  DropChanged = FALSE
  CommitBeforeAck = TRUE
  ResetTailOnRestart = FALSE
  ReRecordMax = FALSE
  Cap = 0
  HoldMode = "persist"
  PersistHolds = TRUE
  StaleRelease = FALSE
  RelNoWindow = FALSE
  SinkAppliesUnconfirmed = FALSE
SYMMETRY ValPerms
INVARIANTS
  TypeOK
  CloseEntryTrue
  SinkValueExisted
  QuiescentSafe
  QuiescentConverges
  RecordConverges
  DeliveredRecordAbsence
CHECK_DEADLOCK FALSE
