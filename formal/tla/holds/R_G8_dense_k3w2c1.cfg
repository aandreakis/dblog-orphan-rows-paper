\* REGRESSION (cap off, Cap = 0): the core configuration G8_dense_k3w2c1.cfg run on the extension's SpecH. Expected: the core's verdict and the core's state counts exactly.
\* GREEN, Dense: every absent unchanged key listed one entry per step, the per-key rendering of the chunk info record's key set (not the atomic record; see Record), treat-as-changed variant. Expected: no error. With a crash (DeliveredRecordAbsence fails here by design, see D1).
\* Bounds: N=3 keys, Vals={v1, v2}, MaxWrites=2, ChunkSize=1, TailLimit=1, MaxCrashes=1.
SPECIFICATION SpecH
CONSTANTS
  N = 3
  Vals = {v1, v2}
  NULL = NULL
  MaxWrites = 2
  ChunkSize = 1
  TailLimit = 1
  MaxCrashes = 1
  VisGap = TRUE
  PrePassSettled = TRUE
  VisRule = "changed"
  PersistPend = TRUE
  Dense = TRUE
  Record = FALSE
  ProgressAtFirst = FALSE
  FullPageOpen = FALSE
  DropChanged = FALSE
  CommitBeforeAck = FALSE
  ResetTailOnRestart = FALSE
  ReRecordMax = FALSE
  Cap = 0
  HoldMode = "persist"
  PersistHolds = TRUE
  StaleRelease = FALSE
  RelNoWindow = FALSE
  SinkAppliesUnconfirmed = FALSE
SYMMETRY ValPerms
INVARIANTS
  TypeOK
  CloseEntryTrue
  SinkValueExisted
  QuiescentSafe
  QuiescentConverges
  RecordConverges
  TilingOK
  LocaleAssumptions
  ScopeBridge
CHECK_DEADLOCK FALSE
