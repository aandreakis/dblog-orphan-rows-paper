\* REGRESSION (cap off, Cap = 0): the core configuration G9_wait_k3w3c0.cfg run on the extension's SpecH. Expected: the core's verdict and the core's state counts exactly.
\* GREEN, waiting variant of the visibility rule (Query waits for the transactions logged before the low watermark), transactions before the pass MAY stay invisible. Expected: no error.
\* Bounds: N=3 keys, Vals={v1, v2}, MaxWrites=3, ChunkSize=1, TailLimit=1, MaxCrashes=0.
SPECIFICATION SpecH
CONSTANTS
  N = 3
  Vals = {v1, v2}
  NULL = NULL
  MaxWrites = 3
  ChunkSize = 1
  TailLimit = 1
  MaxCrashes = 0
  VisGap = TRUE
  PrePassSettled = FALSE
  VisRule = "wait"
  PersistPend = TRUE
  Dense = FALSE
  Record = FALSE
  ProgressAtFirst = FALSE
  FullPageOpen = FALSE
  DropChanged = FALSE
  CommitBeforeAck = FALSE
  ResetTailOnRestart = FALSE
  ReRecordMax = FALSE
  Cap = 0
  HoldMode = "persist"
  PersistHolds = TRUE
  StaleRelease = FALSE
  RelNoWindow = FALSE
  SinkAppliesUnconfirmed = FALSE
SYMMETRY ValPerms
INVARIANTS
  TypeOK
  CloseEntryTrue
  SinkValueExisted
  QuiescentSafe
  QuiescentConverges
  TilingOK
  LocaleAssumptions
  ScopeBridge
CHECK_DEADLOCK FALSE
