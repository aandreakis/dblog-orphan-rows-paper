\* REGRESSION (cap off, Cap = 0): the core configuration P1_pendlost.cfg run on the extension's SpecH. Expected: the core's verdict and the core's state counts exactly.
\* PROBE: the pending-visibility set not persisted across a restart. Expected: CloseEntryTrue violated.
\* Bounds: N=3 keys, Vals={v1, v2}, MaxWrites=3, ChunkSize=1, TailLimit=1, MaxCrashes=1.
