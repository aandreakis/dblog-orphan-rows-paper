\* MUTATION (b) under the treat-as-changed variant (Dense, persist). Expected: NO ERROR, the visibility rule marks every key of a transaction the release's query did not see, which covers the window keys logged after the query.
\* Bounds: N=3 keys, Vals={v1, v2}, MaxWrites=3, ChunkSize=1, TailLimit=1, MaxCrashes=0, Cap=1, HoldMode=persist.
SPECIFICATION SpecH
CONSTANTS
  N = 3
  Vals = {v1, v2}
  NULL = NULL
  MaxWrites = 3
  ChunkSize = 1
  TailLimit = 1
  MaxCrashes = 0
  VisGap = TRUE
  PrePassSettled = TRUE
  VisRule = "changed"
  PersistPend = TRUE
  Dense = TRUE
  Record = FALSE
  ProgressAtFirst = FALSE
  FullPageOpen = FALSE
  DropChanged = FALSE
  CommitBeforeAck = FALSE
  ResetTailOnRestart = FALSE
  ReRecordMax = FALSE
  Cap = 1
  HoldMode = "persist"
  PersistHolds = TRUE
  StaleRelease = FALSE
  RelNoWindow = TRUE
  SinkAppliesUnconfirmed = FALSE
SYMMETRY ValPerms
INVARIANTS
  TypeOKH
  HoldsSafe
  CloseEntryTrue
  SinkValueExistedH
  QuiescentSafeH
  RecordConvergesH
CHECK_DEADLOCK FALSE
